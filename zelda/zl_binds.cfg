// Zelda 64 port: N64 style controls. "exec zl_binds.cfg" to put these back.
//
// N64      PC                What it does
// Stick    W A S D           move (camera relative, like the control stick)
// A        SPACE             roll / sidehop / backflip / jump attack / talk / open / throw
// B        MOUSE1            sword
// Z        MOUSE2            Z-target
// R        SHIFT             shield
// C<       Q                 item
// Cv       R                 item
// C>       F                 item
// C^       TAB / MOUSE3      first person look
// walk     CTRL              hold to walk slowly
//          E                 Half-Life "use" (still works)
//          mouse             camera

unbindall

bind "w" "+forward"
bind "s" "+back"
bind "a" "+moveleft"
bind "d" "+moveright"
bind "UPARROW" "+forward"
bind "DOWNARROW" "+back"
bind "LEFTARROW" "+moveleft"
bind "RIGHTARROW" "+moveright"

bind "SPACE" "+zbtn_a"
bind "MOUSE1" "+zbtn_b"
bind "MOUSE2" "+zbtn_z"
bind "SHIFT" "+zbtn_r"
bind "q" "+zbtn_cleft"
bind "r" "+zbtn_cdown"
bind "f" "+zbtn_cright"
bind "TAB" "+zbtn_cup"
bind "MOUSE3" "+zbtn_cup"
bind "CTRL" "+speed"
bind "e" "+use"

bind "ESCAPE" "cancelselect"
bind "`" "toggleconsole"
bind "~" "toggleconsole"
bind "F5" "snapshot"
bind "F6" "save quick"
bind "F9" "load quick"
bind "PAUSE" "pause"
bind "y" "messagemode"

// Walking speed with CTRL held (OoT tilting the stick a little)
cl_movespeedkey 0.4
// The mouse moves the camera, the camera never looks "inverted"
lookspring 0
lookstrafe 0
